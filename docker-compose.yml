services:
  db:
    image: postgis/postgis:16-3.4
    container_name: afip-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: afip-backend
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      AFIP_JWT_SECRET: ${AFIP_JWT_SECRET}
      AFIP_JWT_TTL_HOURS: ${AFIP_JWT_TTL_HOURS}
      AFIP_NASA_USERNAME: ${AFIP_NASA_USERNAME}
      AFIP_NASA_PASSWORD: ${AFIP_NASA_PASSWORD}
      AFIP_HARVEST_TOKEN: ${AFIP_HARVEST_TOKEN}
      AFIP_ISDA_USERNAME: ${AFIP_ISDA_USERNAME}
      AFIP_ISDA_PASSWORD: ${AFIP_ISDA_PASSWORD}
      AFIP_SMS_PROVIDER: ${AFIP_SMS_PROVIDER}
      AFIP_SMS_USERNAME: ${AFIP_SMS_USERNAME}
      AFIP_SMS_API_KEY: ${AFIP_SMS_API_KEY}
      AFIP_SMS_SENDER_ID: ${AFIP_SMS_SENDER_ID}
      AFIP_ML_URL: http://ml-service:8000
    ports:
      - "8080:8080"

  ml-service:
    build: ./ml-service
    container_name: afip-ml
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
